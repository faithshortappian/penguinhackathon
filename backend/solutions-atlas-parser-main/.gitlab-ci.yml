include:
  - project: appian/prod/k8s-gitlab-runners
    file: /templates/.gitlab-ci.v1.yaml

stages:
  - Lint
  - Test

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE != "merge_request_event"'

lint:
  extends:
    - .executor-small
  stage: Lint
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/python:3.11-slim
  tags:
    - k8s-executor
  before_script:
    - pip install tox
  script:
    - tox -e lint
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  retry: 2

test:
  extends:
    - .executor-small
  stage: Test
  image: $CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX/python:3.11-slim
  tags:
    - k8s-executor
  before_script:
    - pip install tox
  script:
    - tox -e py311
  coverage: '/TOTAL.*\s+(\d+%)$/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage.xml
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  retry: 2
